# Nightly offline test run (docs/architecture.md §13): the same jobs as ci.yml (lint + 6 test shards), every day at 22:00 IST
# (16:30 UTC; GitHub cron is always UTC) on a GitHub-hosted runner. Offline: no test touches the network or data/.
name: nightly-tests

on:
  schedule:
    - cron: "30 16 * * *"  # 22:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-tests
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]  # TEST_SHARD k/6 (tests/conftest.py); the whole suite is ~21 min on one runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils  # pdftotext: checks derived fixture text
          python -m pip install -e ".[dev]"
      - name: Offline tests, shard ${{ matrix.shard }}/6 (network is never required)
        env:
          TEST_SHARD: ${{ matrix.shard }}/6
        run: python -m pytest
