[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financials"
version = "0.1.0"
description = "Personal Indian equity research, screening and point-in-time backtesting engine"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.6", "pyarrow>=17", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff>=0.12"]
bse = ["requests>=2.32,<3", "selenium>=4.35,<5"]  # financials.fetch.bse, GitHub runners only

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"financials.db" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
tmp_path_retention_policy = "failed"  # passing tests delete their temp DuckDB files (the suite used to keep ~5.6 GB)
tmp_path_retention_count = 1

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow unicode (×, −, →) in docs/strings

[tool.ruff.lint.isort]
known-first-party = ["financials", "_fixture_helpers"]
