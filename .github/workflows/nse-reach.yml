name: nse-reach

# One-off probe (owner request 2026-11-16): can GitHub-hosted runners reach NSE? 4 requests, >= 1.5 s apart;
# prints status / size / sha256 only. Runs when this file or the probe changes, or by hand.
on:
  push:
    paths:
      - .github/workflows/nse-reach.yml
      - scripts/probe_nse_reach.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: curl -s https://api.ipify.org; echo " (runner public IP)"
      - run: python scripts/probe_nse_reach.py
