quirks:
  ADR_BUCKET_DIVERGENCE:
    handling: 'ADRs in Institutions (Foreign) for ICICI Bank, NPNP for HDFC Bank: expose fpi_holding_pct'
    profiles:
    - REG31_SHP
    refs: SHP13
    seen:
    - ICICIBANK vs HDFCBANK 2026-09-30
  BANK_NO_DEPRECIATION_LINE:
    handling: Depreciation row NULL for banks
    profiles:
    - IGAAP_BANK
    refs: X58
    seen:
    - 10/10; Axis labels depreciation inside DetailsOfOtherOperatingExpensesAxis
  CONSOLIDATED_REGULATORY_PLACEHOLDER:
    handling: 'named rule: drop GNPA/NNPA/%/RoA/CET1/AT1 when all are 0 in a consolidated filing; ratios read from the standalone
      book'
    profiles:
    - IGAAP_BANK
    refs: X60
    seen:
    - SBIN Q2 FY27 consolidated
    - HDFCBANK Q2 FY27 and Q4 FY26 consolidated
  CONTRACT_LIABILITIES_LABEL_ONLY:
    handling: label rules CONTRACT_LIABILITIES_CURRENT/NONCURRENT
    profiles:
    - INDAS_CORP
    refs: X68
    seen:
    - SWIGGY, PAYTM, INDIAMART, NYKAA, RATEGAIN; not NAUKRI
  DR_SHARES_OUTSIDE_PCT_DENOMINATOR:
    handling: use filed percentages; NPNP share of total computed from quantities
    profiles:
    - REG31_SHP
    refs: SHP9
    seen:
    - HDFCBANK, ITC, RELIANCE 2026-09-30
  DUPLICATE_BROADCAST_SAME_BLOB:
    handling: one vault blob, one filing row per broadcast (data invariant 2)
    profiles:
    - INDAS_INSURANCE
    refs: X64
    seen:
    - 'STARHEALTH Q2 FY27: 5 identical files (sha256 903eb868...)'
    - 'GODIGIT Q2 FY27: 2 identical files'
  ENCUMBRANCE_NOT_PLEDGE:
    handling: promoter_pledge_pct (pledge only) and promoter_encumbered_pct (all kinds) kept separate
    profiles:
    - REG31_SHP
    refs: SHP10
    seen:
    - VEDL 2026-09-30
  EPS_INCONSISTENT:
    handling: meta warning EPS_INCONSISTENT; filed value kept, computed shown as sub-row
    profiles:
    - INDAS_CORP
    refs: X53
    seen:
    - 'TMPV Q2 FY26 consolidated: BasicEarningsLossPerShareFromContinuingAndDiscontinuedOperations -17.5 equals the continuing
      EPS; discontinued EPS 0 while discontinued profit 82,616 Cr'
  EPS_ZERO_PLACEHOLDER:
    handling: COALESCE(NULLIF(filed, 0), owners profit / period-end shares); never observed in 43 corporate + 13 NBFC filings
      (X52 claim retracted)
    profiles: []
    refs: X53
    seen: []
  ESOP_CASH_FLOW_ONLY:
    handling: ESOP TTM via H1/FY bridge
    profiles:
    - INDAS_CORP
    refs: X68
    seen:
    - '10/10 Batch 7: AdjustmentsForSharebasedPayments in FourD only'
  FACE_VALUE_MISTAG:
    handling: derived shares_from_paid_up withheld when no filed EPS implies a share count within 10x; raw kept; no rule (single
      observation)
    profiles:
    - IGAAP_BANK
    refs: X61
    seen:
    - 'KOTAKBANK Q2 FY27 standalone: FaceValueOfEquityShareCapital 994.79 (= paid-up in crore)'
  GI_PROVISIONS_ARE_MEMO_LINES:
    handling: identity OperatingProfit = OperatingIncome - OperatingExpenses
    profiles:
    - IRDAI_GENERAL
    refs: X63
    seen:
    - NIACL 1.98 + 20.87 Cr not deducted in OperatingProfitOrLoss
  GI_SHAREHOLDERSFUNDS_IS_FAIR_VALUE_CHANGE:
    handling: mapped to fair_value_change_*; equity derived from ShareCapital + ReservesAndSurplus + application money
    profiles:
    - IRDAI_GENERAL
    refs: X63
    seen:
    - ICICIGI, NIACL, GICRE
  IND_AS_117_EQUITY_ELEMENT:
    handling: INS_EQUITY identity on ShareCapital
    profiles:
    - INDAS_INSURANCE
    refs: X64
    seen:
    - Equity = ShareCapital + AssignedCapital + ... (not EquityShareCapital)
  NO_NPA_ELEMENTS:
    handling: gnpa_pct / nnpa_pct / pcr NULL; never parsed from text blocks
    profiles:
    - INDAS_NBFC
    refs: X54
    seen:
    - 0 of 10 Batch 4 filings
  NO_PROMOTER_CATEGORY:
    handling: 'named rule: no promoter facts + public + NPNP = total + no encumbrance -> promoter 0'
    profiles:
    - REG31_SHP
    refs: SHP11
    seen:
    - HDFCBANK 2026-06-30 and 2026-09-30
    - ICICIBANK 2026-09-30
    - ITC 2026-09-30
  OWNERS_SIGN_FLIP:
    handling: quarantine (single observation)
    profiles:
    - INDAS_CORP
    refs: X67
    seen:
    - 'OLAELEC Q2 FY27 H1: owners +698 vs PAT -698'
  OWNERS_TAGGED_AS_TCI:
    handling: named rule when NCI = 0 (owners := PAT); with NCI != 0 still quarantined
    profiles:
    - INDAS_NBFC
    - INDAS_CORP
    refs: X56,X67
    seen:
    - CHOLAFIN Q2 FY27
    - DELHIVERY Q2 FY27
  REVISION_RPT_ONLY:
    handling: revision is a new filing (supersedes); financials identical
    profiles:
    - IRDAI_GENERAL
    refs: X63
    seen:
    - 'ICICIGI Q2 FY27 revision: 235 related-party facts changed, no financial figure'
  ROA_ANNUALISATION_VARIES:
    handling: stored as roa_filed; screens use computed roa (TTM owners profit / avg total assets)
    profiles:
    - IGAAP_BANK
    refs: X59
    seen:
    - KOTAKBANK Q 0.0048 vs H1 0.0101 (not annualised)
    - BANKBARODA Q 0.0126 vs H1 0.0075
  SOLVENCY_PERCENT_SCALING:
    handling: 'named rule: filed < 0.5 multiplied by 100 into solvency_ratio_times; filed kept'
    profiles:
    - IRDAI_LIFE
    - IRDAI_GENERAL
    refs: X65
    seen:
    - ICICIGI 0.0275
    - NIACL 0.0161
    - GICRE 0.0418
    - LICI 0.0235 (vs HDFCLIFE 1.8, SBILIFE 1.97 in times)
  SWF_DOMESTIC_AS_GOVERNMENT:
    handling: Screener moves domestic SWF from DII to Government; we keep the SEBI category (named divergence)
    profiles:
    - REG31_SHP
    refs: SHP15
    seen:
    - HDFCBANK 2026-09-30
  TAXONOMY_TYPO_FinanicalAssets:
    handling: mapped as spelt by the taxonomy
    profiles:
    - INDAS_NBFC
    refs: X54
    seen:
    - all 10 Batch 4 filings
  ZERO_ATTRIBUTION_PLACEHOLDER:
    handling: 'named rule: drop owners/NCI facts, owners falls back to PAT'
    profiles:
    - INDAS_CORP
    - INDAS_NBFC
    refs: X48
    seen:
    - APLAPOLLO Q2 FY27
    - PNBHOUSING Q2 FY27
