# Single source of truth for every feed in the architecture. docs/data_sources.md is GENERATED from
# this file (`python -m financials.sources --write`); tests/test_data_sources.py keeps them in sync and
# checks that every VERIFIED/OBSERVED entry cites evidence IDs present in docs/references.md.
#
# verification_status:
#   VERIFIED   - real file committed in tests/fixtures/ and behaviour pinned by a test
#   OBSERVED   - endpoint answered with the described content from this container, no committed fixture
#   UNVERIFIED - believed to exist; endpoint/format not checked (do not code against it)
#   PLANNED    - in the roadmap; no source identified yet
# fetch_runtime:
#   CONTAINER_DIRECT - answered from a cloud container with a browser User-Agent, no cookie warm-up
#   SESSION_WARMED   - known to need a warmed browser session
#   UNKNOWN          - not probed
# All www.nseindia.com/api endpoints probed so far answered CONTAINER_DIRECT (references A1).

feeds:
  - feed_id: F01
    name: UDiFF cash-market bhavcopy
    exchange_or_agency: NSE
    url_or_endpoint_pattern: https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_<YYYYMMDD>_F_0000.csv.zip
    format: CSV in zip (UDiFF)
    cadence: Daily, trading days
    fetch_runtime: CONTAINER_DIRECT
    join_keys: [trade_date, FinInstrmId, ISIN, TckrSymb, SctySrs]
    target_tables: [raw_cm_bhavcopy, ohlcv, security_identifier_history, trading_calendar]
    unlocked_metrics: [close, returns, DMA, 52W high, market cap, gap auditor]
    phase: 1
    verification_status: VERIFIED
    evidence: [P1, P2, P5, P13]
    notes: PrvsClsgPric is unadjusted on ex-dates. FinInstrmId follows (security, series).

